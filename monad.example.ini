debug = true

[server]
; Trust X-Forwarded-Proto from a reverse proxy (e.g. nginx) that terminates
; TLS. Enable only when the app is not directly reachable from the internet.
trust_proxy = false

[db]
path = "db.sqlite"

[auth]
table = "users"
identifier = "email"
password = "password"
loginPath = "/login"

[cache]
path = "cache"

[migrations]
path = "migrations"

[views]
path = "views"
